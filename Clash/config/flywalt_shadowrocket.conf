[Host]
# Apple 服务强制使用系统 DNS，避免被错误劫持
*.apple.com = server:system
*.icloud.com = server:system
localhost = 127.0.0.1

[URL Rewrite]
# Google CN 防跳转
^https?://(www.)?g.cn https://www.google.com 302
^https?://(www.)?google.cn https://www.google.com 302

[MITM]
# 仅解密 google.cn 以让 URL Rewrite 在加密流量上生效
hostname = *.google.cn
