[custom]
;flywalt 外部配置版（供 &config= 使用）
;内容与 Clash/pref.ini 同源：规则顺序、分组定义一致
;差异：相对路径改为 ghproxy 绝对 URL；ConnersHua 源换为 fork 自带 ProxyMedia/Telegram

;设置规则标志位
ruleset=🎯 全球直连,https://ghproxy.net/https://raw.githubusercontent.com/flywalt/ACL4SSR/master/Clash/LocalAreaNetwork.list
; 自定义直连规则
; 自建服务例外：flight2 = VLESS 节点伪装 SNI；其余 cfargotunnel 站点回源家里，走代理会经租用节点中转，保持直连
ruleset=🎯 全球直连,[]DOMAIN,flight2.fsun.eu.org
ruleset=🎯 全球直连,[]DOMAIN,alist.fsun.eu.org
ruleset=🎯 全球直连,[]DOMAIN,ha.fsun.eu.org
ruleset=🎯 全球直连,[]DOMAIN,immich.fsun.eu.org
ruleset=🎯 全球直连,[]DOMAIN,nas.fsun.eu.org
ruleset=🎯 全球直连,[]DOMAIN,oc.fsun.eu.org
ruleset=🎯 全球直连,[]DOMAIN,op.fsun.eu.org
ruleset=🎯 全球直连,[]DOMAIN,speedtest.fsun.eu.org
; 其余 fsun 子域（Workers / Pages / R2 / Oracle VPS）走 HK 落地，避开 CMCC direct 落美西/欧洲
ruleset=🇭🇰 自建服务,[]DOMAIN-SUFFIX,fsun.eu.org
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,tuaremax.top
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,tailscale.com
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,ts.net
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,argotunnel.com
ruleset=🎯 全球直连,[]IP-CIDR,100.64.0.0/10,no-resolve
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,opencode.ai
; 广告拦截
ruleset=🛑 全球拦截,https://ghproxy.net/https://raw.githubusercontent.com/flywalt/ACL4SSR/master/Clash/BanAD.list
ruleset=⛔ 应用拦截,https://ghproxy.net/https://raw.githubusercontent.com/flywalt/ACL4SSR/master/Clash/BanProgramAD.list
