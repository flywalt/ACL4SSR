;设置分组标志位
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇨🇳 台湾节点`[]🇸🇬 狮城节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇰🇷 韩国节点`[]🚀 手动切换`[]DIRECT
custom_proxy_group=🚀 手动切换`select`.*
custom_proxy_group=♻️ 自动选择`url-test`^(?!.*[Oo]racle).*$`http://www.gstatic.com/generate_204`300,,50
; 自建服务专用：固定 HK 落地（HK-01~06 出口均为腾讯云 SG，CF colo=SIN；HK-07 会落 LHR，故意不列）
